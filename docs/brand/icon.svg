<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="ytbplus">
  <defs>
    <linearGradient id="plate" x1="0" y1="16" x2="0" y2="496" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#469DD3"/>
      <stop offset="1" stop-color="#1F5C8C"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="16" x2="0" y2="496" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".6"/>
      <stop offset=".22" stop-color="#fff" stop-opacity=".1"/>
      <stop offset=".8" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".2"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="16" x2="0" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".24"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bar" x1="146" y1="0" x2="366" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD364"/>
      <stop offset=".34" stop-color="#FF8899"/>
      <stop offset=".67" stop-color="#77BBDD"/>
      <stop offset="1" stop-color="#77DD77"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0B2C48" flood-opacity=".38"/>
    </filter>
    <filter id="lift" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0B2C48" flood-opacity=".4"/>
    </filter>
    <clipPath id="plate-clip"><rect x="16" y="16" width="480" height="480" rx="112"/></clipPath>
  </defs>

  <g filter="url(#drop)">
    <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#plate)"/>
    <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#sheen)" clip-path="url(#plate-clip)"/>
    <rect x="17" y="17" width="478" height="478" rx="111" fill="none" stroke="url(#rim)" stroke-width="2"/>
  </g>

  <g filter="url(#lift)">
    <path d="M205 197 Q198 192 198 203 L198 363 Q198 374 205 369 L361 281 Q368 276 361 271 Z" fill="#fff"/>
    <rect x="146" y="400" width="220" height="30" rx="15" fill="url(#bar)"/>
    <rect x="149" y="403" width="214" height="10" rx="5" fill="url(#gloss)" opacity=".45"/>
  </g>
</svg>
